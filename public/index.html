<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6757d9" />
  <meta name="description" content="منصة تعلّم عربية تجريبية للرحلات التعليمية والمراجعة المتكيفة" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="/styles.css?v=3" />
  <title>منصة التعلّم</title>
</head>
<body>
  <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
  <div id="app" aria-live="polite"></div>
  <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
  <!-- No ?v= query string here on purpose: chat.js imports app.js back (a safe circular reference —
       see docs/DECISIONS.md), and ES module identity is keyed by the exact resolved URL including any
       query string. A version-busted URL here would resolve differently than chat.js's own bare
       `import ... from './app.js'`, causing the browser to fetch and instantiate app.js TWICE as two
       separate module graphs — two state objects, and every click/input/submit/keydown listener
       registered twice. Freshness after a deploy is already handled by the no-cache response header
       (see server.mjs's serveStatic), which forces revalidation on every load without needing this. -->
  <script type="module" src="/app.js"></script>
</body>
</html>
