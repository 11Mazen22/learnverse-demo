<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06111f">
  <title>Offline · Noata</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111d;color:#eef5ff;font-family:Segoe UI,Arial,sans-serif;padding:24px}
    main{width:min(520px,100%);padding:32px;border:1px solid #1d3149;border-radius:26px;background:#0c1929;box-shadow:0 24px 70px #0006;text-align:center}
    .mark{width:56px;height:56px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;font-size:28px;font-weight:900;background:linear-gradient(135deg,#2f7cff,#78d7ff)}
    p{color:#9fb1c9;line-height:1.8}button{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}
  </style>
</head>
<body><main><div class="mark">N</div><h1 id="offline-title">أنت غير متصل حاليًا</h1><p id="offline-description">الواجهة الأساسية متاحة، لكن بيانات التقدم وNoata AI محتاجين اتصال علشان نحافظ على التزامن والأمان.</p><button id="offline-retry" onclick="location.reload()">جرّب الاتصال تاني</button></main><script>
(function(){
 var locale="ar";
 try{
  var cookie=document.cookie.match(/(?:^|;\s*)noata_locale=(en|ar)(?:;|$)/);
  var preferred=cookie?cookie[1]:localStorage.getItem("noata-locale");
  if(preferred==="en"||preferred==="ar")locale=preferred;
 }catch(e){}
 document.documentElement.lang=locale;
 document.documentElement.dir=locale==="en"?"ltr":"rtl";
 if(locale==="en"){
  document.getElementById("offline-title").textContent="You are offline";
  document.getElementById("offline-description").textContent="Your learning progress and Noata AI need an internet connection to stay synchronized and secure.";
  document.getElementById("offline-retry").textContent="Try again";
 }
})();
</script></body>
</html>
