name: Noata AI UI QA

on:
  push:
    branches:
      - noata-ai-reading-experience-20261014
  pull_request:
    branches:
      - noata-aura-platform-overhaul-20261008

permissions:
  contents: read

concurrency:
  group: noata-ai-ui
  cancel-in-progress: true

jobs:
  ui:
    name: Readability and responsive browser validation
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vpfpjvhafkmygetjkfcp.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_network_isolation_fixture_only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:text
      - run: pnpm typecheck
      - run: node --test apps/web/lib/ai/quran-directives.test.ts apps/web/lib/ai/live-stream.test.ts apps/web/lib/ai/display-markdown.test.ts
      - run: pnpm build
      - name: Install full Chrome for Testing
        run: node scripts/install-qa-chrome.mjs
      - name: Real Chrome RTL and responsive smoke
        run: node scripts/browser-aura-smoke.mjs
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noata-ai-reading-browser-evidence
          path: artifacts/noata-browser/
          if-no-files-found: ignore
          retention-days: 7
