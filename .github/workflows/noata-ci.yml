name: Noata CI

on:
  push:
    branches: [master, noata-v1-rebuild, noata-v2-total-redesign, noata-aura-platform-overhaul-20261008]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: noata-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Validate staging and browser runner syntax (no accounts used)
        run: |
          node --check scripts/browser-aura-smoke.mjs
          node --check scripts/authenticated-aura-smoke.mjs
          node --check scripts/lib/qa-browser.mjs
          node --check scripts/lib/ui-account-fixture.mjs
          node --check scripts/lib/public-curriculum-fixture.mjs
          node --check scripts/install-qa-chrome.mjs
          node --check scripts/browser-launch-smoke.mjs
      - name: Browser startup fault regressions
        run: node --test scripts/qa-browser.test.mjs
      - run: pnpm modern:test
      - run: deno check --config supabase/functions/noata-ai/deno.json supabase/functions/noata-ai/index.ts
      - name: Real Arabic PDF and DOCX fixtures
        run: node scripts/document-export-smoke.mjs
      - run: pnpm build
      - name: Install pinned full Chrome for Testing
        run: node scripts/install-qa-chrome.mjs
      - name: Real Chrome startup and CDP isolation
        run: node scripts/browser-launch-smoke.mjs
      - name: Real browser RTL and responsive smoke
        run: node scripts/browser-aura-smoke.mjs
      - name: Upload Noata Aura browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noata-aura-release-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Production HTTP smoke
        shell: bash
        run: |
          pnpm --filter @noata/web start > /tmp/noata-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health | grep -q '"ok":true'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/noata-next.log
            exit 1
          fi

          for path in / /learn /ai /missions /review /boss /progress /rewards /assignments /settings /help /quran /notifications /teacher /admin /login /privacy /terms; do
            curl -fsS -o /dev/null "http://127.0.0.1:3000$path"
          done

          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^x-frame-options: DENY'
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^x-content-type-options: nosniff'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/documents/pdf -H 'Content-Type: application/json' -H 'Origin: https://untrusted.invalid' --data '{}')" = 403
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/documents/pdf -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' --data '{}')" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/qa-target)" = 404
      - run: pnpm legacy:check

