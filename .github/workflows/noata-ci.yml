name: Noata CI

on:
  push:
    branches: [noata-v1-rebuild]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: deno check supabase/functions/noata-ai/index.ts
      - run: pnpm build
      - run: npm run legacy:check
